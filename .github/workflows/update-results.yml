name: Atualizar resultados Exilados GP

on:
  workflow_dispatch:
  schedule:
    - cron: "7/5 * * * *"

permissions:
  contents: write

concurrency:
  group: exilados-gp-results
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar criptografia
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Consultar corridas e gerar bundle privado
        env:
          # Reutiliza o mesmo secret criado na V11. Ele agora criptografa o
          # arquivo de identidades; não é mais usado para chamar o InfinityFree.
          IDENTITY_BUNDLE_KEY: ${{ secrets.IDENTITY_INGEST_KEY }}
          IDENTITY_BUNDLE_REQUIRED: "1"
          IDENTITY_BUNDLE_OUTPUT: data/identities.enc.json
        run: python scripts/update_results.py

      - name: Publicar arquivos atualizados
        run: |
          if [ -z "$(git status --porcelain -- data/races.json data/identities.enc.json)" ]; then
            echo "Nenhuma corrida ou identidade nova/alterada."
            exit 0
          fi
          git config user.name "exilados-gp-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/races.json data/identities.enc.json
          git commit -m "Atualiza resultados e identidades criptografadas"
          git push
